<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito+Sans:wght@400;600;700&display=swap');

  :root{
    --plum: #2b1630;
    --plum-deep: #1a0e1f;
    --icing: #f6a9c9;
    --icing-soft: #fbd7e6;
    --gold: #f0b84b;
    --gold-bright: #ffd873;
    --cream: #fbf5ec;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(ellipse at top, var(--plum) 0%, var(--plum-deep) 70%);
    font-family:'Nunito Sans', sans-serif;
    color: var(--cream);
    overflow-x:hidden;
  }

  .stage{
    position: relative;
    min-height: 100vh;
    display:grid;
    place-items:center;
    padding: 40px 20px;
  }

  .stage > *{
    grid-column: 1;
    grid-row: 1;
  }

  .watermark{
    transform: scale(2.4);
    opacity: 0.10;
    z-index:0;
    pointer-events:none;
  }

  .card{
    max-width: 640px;
    width:100%;
    text-align:center;
    position:relative;
    z-index:2;
  }

  .eyebrow{
    font-size:0.8rem;
    letter-spacing: 0.25em;
    text-transform:uppercase;
    color: var(--icing-soft);
    opacity:0.75;
    margin-bottom: 14px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-optical-sizing:auto;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height: 1.02;
    margin: 0 0 18px;
    color: var(--cream);
    text-wrap: balance;
    text-align: center;
    width: 100%;
  }

  h1 .accent{
    font-style:italic;
    font-weight:600;
    color: var(--icing);
  }

  #nameField{
    background:transparent;
    border:none;
    border-bottom: 3px dashed rgba(246,169,201,0.5);
    color: var(--gold-bright);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size: 0.85em;
    text-align:center;
    width: 220px;
    max-width: 60vw;
    outline:none;
    padding: 0 4px;
  }
  #nameField::placeholder{ color: rgba(255,216,115,0.55); }
  #nameField:focus{ border-bottom-color: var(--gold-bright); }

  .message{
    font-size: 1.15rem;
    line-height:1.6;
    color: var(--icing-soft);
    max-width: 460px;
    margin: 0 auto 44px;
  }

  /* CAKE */
  .cake-wrap{
    position:relative;
    width: 260px;
    margin: 0 auto 40px;
  }

  .plate{
    width: 260px;
    height: 18px;
    background: linear-gradient(180deg, rgba(246,169,201,0.35), rgba(246,169,201,0.05));
    border-radius: 50%;
    margin-top: -6px;
  }

  .tier{
    border-radius: 10px;
    position:relative;
    margin: 0 auto;
  }
  .tier::before{
    content:"";
    position:absolute;
    top:-8px; left:-4px; right:-4px;
    height: 16px;
    background: var(--icing-soft);
    border-radius: 50% / 100%;
  }
  .tier.bottom{
    width: 220px; height: 70px;
    background: linear-gradient(180deg, #7a3b62, #5c2a4b);
  }
  .tier.top{
    width: 150px; height: 56px;
    background: linear-gradient(180deg, #8a4570, #6c3457);
    margin-top: 6px;
  }

  .candles{
    display:flex;
    justify-content:center;
    gap: 18px;
    position:relative;
    top: 10px;
  }

  .candle{
    width: 10px;
    height: 46px;
    background: repeating-linear-gradient(180deg, var(--gold) 0 8px, var(--gold-bright) 8px 16px);
    border-radius: 3px;
    position:relative;
    cursor:pointer;
  }

  .flame{
    position:absolute;
    top:-22px;
    left:50%;
    transform: translateX(-50%);
    width: 14px;
    height: 22px;
    background: radial-gradient(circle at 50% 70%, #fff6d0, var(--gold-bright) 40%, #ff9d3d 75%, transparent 80%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    animation: flicker 1.4s ease-in-out infinite;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%{ transform: translateX(-50%) scale(1.08) rotate(2deg); }
  }

  .candle.out .flame{
    opacity:0;
    transform: translateX(-50%) scale(0.2);
  }
  .candle.out::after{
    content:"";
    position:absolute;
    top:-24px;
    left:50%;
    transform: translateX(-50%);
    width: 3px;
    height: 10px;
    background: rgba(200,200,200,0.5);
    filter: blur(2px);
    animation: smoke 1.6s ease-out forwards;
  }
  @keyframes smoke{
    0%{ opacity:0.6; transform: translate(-50%, 0) scaleY(1); }
    100%{ opacity:0; transform: translate(-50%, -30px) scaleY(2.4); }
  }

  .hint{
    font-size: 0.85rem;
    color: rgba(251,215,230,0.55);
    margin-top: 8px;
  }

  .wish-line{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size: 1.3rem;
    color: var(--gold-bright);
    min-height: 1.8em;
    margin-top: 10px;
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .wish-line.show{ opacity:1; }

  .gift-btn{
    display: inline-block;
    font-family:'Nunito Sans', sans-serif;
    font-weight:700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    color: var(--plum-deep);
    background: linear-gradient(135deg, var(--gold-bright), var(--icing));
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    margin-top: 30px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(240,184,75,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .gift-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(240,184,75,0.35);
  }
  .gift-btn:active{
    transform: translateY(0);
  }
  .gift-btn:focus-visible{
    outline: 2px solid var(--cream);
    outline-offset: 3px;
  }

  .confetti{
    position:fixed;
    top:-10px;
    width: 8px;
    height: 14px;
    z-index:1;
    pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(600deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame{ animation:none; }
    .confetti{ animation:none; display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="watermark cake-wrap">
    <div class="candles">
      <div class="candle" data-out="false"><div class="flame"></div></div>
      <div class="candle" data-out="false"><div class="flame"></div></div>
      <div class="candle" data-out="false"><div class="flame"></div></div>
    </div>
    <div class="tier top"></div>
    <div class="tier bottom"></div>
    <div class="plate"></div>
  </div>

  <div class="card">
    <h1>Happy Birthday<br>my <span class="accent">Lady</span>&lt;3</h1>
    <a class="gift-btn" href="gift.html">click here to see the gift</a>
  </div>
</div>

<script>
</script>

</body>
</html>
